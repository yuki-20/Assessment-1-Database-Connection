name: Verify assessment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-and-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install notebook dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify database, queries, export and connection closure
        run: python database_lab.py
      - name: Execute every notebook cell
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          from nbclient import NotebookClient
          path = Path('01_Database_Connection.ipynb')
          notebook = nbformat.read(path, as_version=4)
          nbformat.validate(notebook)
          NotebookClient(notebook, timeout=180, kernel_name='python3').execute()
          print('All notebook cells executed successfully.')
          PY
